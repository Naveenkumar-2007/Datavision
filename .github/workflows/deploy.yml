name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy-to-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backend Lint Check
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check backend/ --select=E9,F63,F7,F82

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend Dist
        run: |
          cd frontend
          npm install
          npm run build

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          TOKEN="${HF_TOKEN:-$HUGGINGFACE_TOKEN}"
          SPACE_NAME="${HF_SPACE:-datavision-ai/Datavision}"
          
          if [ -n "$TOKEN" ]; then
            echo "🚀 Pushing clean release to Hugging Face Space: $SPACE_NAME"
            git config --global user.email "ci@datavision.ai"
            git config --global user.name "DataVision CI/CD Bot"
            git config --global lfs.allowincompletepush true

            # Install Git LFS
            git lfs install

            # Create clean orphan release branch without historical broken LFS pointers
            git checkout --orphan hf-release
            git reset

            # Stage all current active files and frontend dist
            git add -A
            git add -f frontend/dist
            git commit -m "release: clean production build for HuggingFace Space" || true

            # Setup HF remote
            git remote remove hf 2>/dev/null || true
            git remote add hf "https://user:$TOKEN@huggingface.co/spaces/$SPACE_NAME"

            # Upload active LFS objects to HF LFS storage
            echo "📦 Uploading active Git LFS objects to Hugging Face..."
            git lfs push --all hf || true

            # Push clean orphan release branch to Hugging Face Space main
            echo "🚀 Force pushing clean release to Hugging Face..."
            git push -f hf hf-release:main
            echo "✅ Successfully deployed to Hugging Face Space: $SPACE_NAME"
          else
            echo "⚠️ HF_TOKEN or HUGGINGFACE_TOKEN secret is required in GitHub repository settings!"
            exit 1
          fi
