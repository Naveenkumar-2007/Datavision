name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy-to-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backend Lint Check
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check backend/ --select=E9,F63,F7,F82

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend Dist
        run: |
          cd frontend
          npm install
          npm run build

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          TOKEN="${HF_TOKEN:-$HUGGINGFACE_TOKEN}"
          SPACE_NAME="${HF_SPACE:-datavision-ai/Datavision}"
          
          if [ -n "$TOKEN" ]; then
            echo "🚀 Pushing codebase to Hugging Face Space: $SPACE_NAME"
            git config --global user.email "ci@datavision.ai"
            git config --global user.name "DataVision CI/CD Bot"
            git config --global lfs.allowincompletepush true

            # Install Git LFS and enforce tracking for all image binary extensions
            git lfs install
            git lfs track "*.png" "*.jpg" "*.jpeg" "*.gif" "*.ico"

            # Renormalize dist directory so git forces LFS pointer filter on images
            git add -f .gitattributes
            git add -f frontend/dist
            git add --renormalize frontend/dist
            git commit -m "build: bundle frontend distribution for HF Space" || true

            git remote remove hf 2>/dev/null || true
            git remote add hf "https://user:$TOKEN@huggingface.co/spaces/$SPACE_NAME"

            # Upload all LFS binary objects to HF LFS storage first
            echo "📦 Uploading Git LFS objects to Hugging Face..."
            git lfs push --all hf || true
            
            # Push git commit refs
            echo "🚀 Pushing git ref HEAD:main to Hugging Face..."
            git push -f hf HEAD:main
            echo "✅ Successfully deployed to Hugging Face Space: $SPACE_NAME"
          else
            echo "⚠️ HF_TOKEN or HUGGINGFACE_TOKEN secret is required in GitHub repository settings!"
            echo "Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret: HF_TOKEN"
            exit 1
          fi
